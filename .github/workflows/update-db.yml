name: Update KOSHA DB & Deploy

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Fetch KOSHA API & Build Lite DB
        env:
          KOSHA_API_KEY: ${{ secrets.KOSHA_API_KEY }}
        run: python scripts/update_kosha_db.py

      - name: Commit updated DB
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/accidents_db_lite.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 공단 국내재해사례 DB 자동 업데이트"
            git pull --rebase
            git push
          fi

      - name: Setup Node & Build App
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
